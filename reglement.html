<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reglement Competitie - TPV De Hopbel</title>

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f6f8fb;
      margin: 0;
      padding: 0;
      color: #1f2937;
      line-height: 1.6;
    }

    .wrapper {
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 30px;
      border: 1px solid #d9e1ea;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.08);
    }

    h1 {
      margin-top: 0;
      color: #1f78be;
    }

    h2 {
      margin-top: 30px;
      color: #1f78be;
    }

    ol {
      padding-left: 22px;
      margin-top: 10px;
      margin-bottom: 20px;
    }

    ol li {
      margin-bottom: 10px;
    }

    .club {
      color: #667085;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .footer {
      margin-top: 30px;
      font-size: 14px;
      color: #667085;
    }
  </style>
</head>

<body>
  <div class="wrapper">
    <div class="card">
      <div class="club">TPV De Hopbel</div>
      <!-- De tekst van het reglement staat in reglement.txt -->
      <div id="reglement">Reglement wordt geladen...</div>

      <div class="footer">
        Voor vragen kun je contact opnemen via
        <strong>competitie@tpvdehopbel.nl</strong>.
      </div>
    </div>
  </div>

  <script>
    // Zet reglement.txt om naar HTML.
    //   # Titel       -> hoofdtitel
    //   ## Kopje      -> kopje
    //   - Regel       -> genummerde regel
    //   **tekst**     -> vetgedrukt
    //   overige tekst -> gewone alinea
    function escapeHtml(tekst) {
      return tekst.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function opmaak(tekst) {
      return escapeHtml(tekst).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    }

    function zetOmNaarHtml(tekst) {
      let html = '';
      let inLijst = false;

      for (const ruweRegel of tekst.split(/\r?\n/)) {
        const regel = ruweRegel.trim();
        const isLijstRegel = regel.startsWith('- ');

        if (inLijst && !isLijstRegel) {
          html += '</ol>';
          inLijst = false;
        }

        if (!regel) continue;

        if (regel.startsWith('## ')) {
          html += `<h2>${opmaak(regel.slice(3))}</h2>`;
        } else if (regel.startsWith('# ')) {
          html += `<h1>${opmaak(regel.slice(2))}</h1>`;
        } else if (isLijstRegel) {
          if (!inLijst) {
            html += '<ol>';
            inLijst = true;
          }
          html += `<li>${opmaak(regel.slice(2))}</li>`;
        } else {
          html += `<p>${opmaak(regel)}</p>`;
        }
      }

      if (inLijst) html += '</ol>';
      return html;
    }

    fetch('reglement.txt', { cache: 'no-cache' })
      .then((response) => {
        if (!response.ok) throw new Error('reglement.txt niet gevonden');
        return response.text();
      })
      .then((tekst) => {
        document.getElementById('reglement').innerHTML = zetOmNaarHtml(tekst);
      })
      .catch(() => {
        document.getElementById('reglement').textContent =
          'Het reglement kon niet worden geladen. Neem contact op via competitie@tpvdehopbel.nl.';
      });
  </script>
</body>
</html>
